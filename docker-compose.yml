# Everything Acuse needs, in one command: docker compose up -d
# First boot creates the database schema automatically (db/schema.sql runs
# against the empty volume). Data survives restarts in the `acuse-data` volume.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acuse
      POSTGRES_USER: acuse
      POSTGRES_PASSWORD: acuse
    volumes:
      - acuse-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acuse -d acuse']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://acuse:acuse@db:5432/acuse
      APP_URL: http://localhost:3000
      EMBEDDED_WORKER: '1'
      # Uncomment to lock the console behind HTTP Basic Auth (any username):
      # CONSOLE_PASSWORD: choose-a-long-password
      # Uncomment if untrusted people can create endpoints on this instance:
      # BLOCK_PRIVATE_DESTINATIONS: '1'
      # Where to POST a JSON alert when an event exhausts its retries
      # (a chat webhook, an automation-platform trigger, or another Acuse):
      # ALERT_WEBHOOK_URL: https://hooks.example.com/acuse-alerts
      # Per-client branding: the header reads «Acuse · <name>»:
      # INSTANCE_NAME: Empresa X
      # Archive (never delete) delivered events older than N days:
      # RETENTION_DAYS: '90'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  acuse-data:
